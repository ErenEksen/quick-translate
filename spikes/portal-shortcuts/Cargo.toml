[package]
name = "portal-shortcuts-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Week-1 spike 2.4: XDG GlobalShortcuts portal from an unsandboxed binary"

# Standalone: the root workspace excludes spikes/.
[workspace]

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "net", "signal", "process"] }
futures-util = "0.3"
rustix = { version = "1", features = ["time"] }
evdev = "0.13"
anyhow = "1"
